<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Apex Horizon Bank & Trust | Redirecting...</title>
    <script type="text/javascript">
      // Single Page App redirect for GitHub Pages clean path routing
      // MIT License - https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1;
      var l = window.location;
      var repoPrefix = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
      var cleanRoute = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~');
      var searchStr = l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '';
      var redirectUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        repoPrefix + '/?/' + cleanRoute + searchStr + l.hash;
      window.location.replace(redirectUrl);
    </script>
  </head>
  <body>
    <p>Redirecting to Apex Horizon Bank...</p>
  </body>
</html>
