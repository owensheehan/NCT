<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Apex Horizon Bank & Trust | Redirecting...</title>
    <script type="text/javascript">
      // Single Page App redirect for GitHub Pages
      // Converts path to hash path and preserves query parameters
      var pathSegmentsToKeep = 1;
      var l = window.location;
      var repoName = l.pathname.split('/')[1] || '';
      var cleanPath = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
      var query = l.search ? l.search : '';
      var hash = l.hash ? l.hash : '';
      var redirectUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        (repoName ? '/' + repoName : '') + '/#/' + cleanPath + query + hash;
      window.location.replace(redirectUrl);
    </script>
  </head>
  <body>
    <p>Redirecting to Apex Horizon Bank...</p>
  </body>
</html>
